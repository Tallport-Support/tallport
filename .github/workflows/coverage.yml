name: Coverage

# Separate from the Tests workflow, which release.sh checks: coverage is a
# report, not a gate.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: freescout-test
          MARIADB_USER: freescout-test
          MARIADB_PASSWORD: freescout-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysql, mbstring, xml, imap, zip, gd, curl, intl, json
          coverage: pcov
          tools: composer

      - name: Cache test tools
        uses: actions/cache@v4
        with:
          path: dev/vendor
          key: dev-vendor-php8.5-${{ hashFiles('dev/composer.lock') }}

      - name: Run tests with coverage
        env:
          DB_TEST_HOST: 127.0.0.1
        run: ./test.sh --coverage-text=coverage/summary.txt --coverage-html coverage/html

      - name: Summary
        if: always()
        run: |
          {
            echo '## Line coverage of app/'
            echo '```'
            sed -n '1,12p' coverage/summary.txt
            echo '```'
            echo '<details><summary>Per class</summary>'
            echo
            echo '```'
            sed -n '13,$p' coverage/summary.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
