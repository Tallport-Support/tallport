name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Test PHP 8.5 with the imap extension (PECL); MariaDB is the production database.
        php: ['8.5']
        mariadb: ['11.8']
        # The suite on in-memory SQLite (its default), MariaDB, MySQL and PostgreSQL;
        # the MariaDB-only tests (Tests\Concerns\UsesMariaDB) run in each, on MariaDB.
        db: ['sqlite', 'mysql', 'pgsql']
        include:
          # MySQL 8.4 LTS: the mysql driver (DB_TEST_DRIVER=mysql) on MySQL's port.
          - php: '8.5'
            mariadb: '11.8'
            db: 'mysql-8.4'

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: freescout-test
          MARIADB_USER: freescout-test
          MARIADB_PASSWORD: freescout-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: freescout-test
          MYSQL_USER: freescout-test
          MYSQL_PASSWORD: freescout-test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: freescout-test
          POSTGRES_USER: freescout-test
          POSTGRES_PASSWORD: freescout-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U freescout-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysql, sqlite3, pdo_sqlite, pgsql, pdo_pgsql, mbstring, xml, imap, zip, gd, curl, intl, json, redis
          coverage: none
          tools: composer

      - name: Cache test tools
        uses: actions/cache@v4
        with:
          path: dev/vendor
          key: dev-vendor-php${{ matrix.php }}-${{ hashFiles('dev/composer.lock') }}

      - name: Run tests
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_DRIVER: ${{ matrix.db == 'mysql-8.4' && 'mysql' || matrix.db }}
          DB_TEST_PORT: ${{ matrix.db == 'mysql-8.4' && '3307' || '3306' }}
        run: ./test.sh

      # Snapshots depend on the environment (e.g. libxml2): on failure, make
      # this environment's snapshots available for review.
      - name: Regenerate snapshots
        if: failure()
        env:
          DB_TEST_HOST: 127.0.0.1
          UPDATE_SNAPSHOTS: 1
        run: php dev/vendor/bin/phpunit --filter Snapshot || true

      - name: Upload snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: tests/Snapshots

  code-style:
    name: Code style (PHP_CodeSniffer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: phpcs:4

      # Rules and checked paths are in phpcs.xml.
      - name: Check code style
        run: phpcs

  vendor:
    name: vendor/ matches composer install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, imap, zip, gd, curl, intl, json
          coverage: none
          # Composer writes its own files into vendor/composer/, and they
          # vary between Composer versions. Keep in step with README.md.
          tools: composer:2.9.7

      - name: Reinstall vendor/ from composer.lock
        run: |
          rm -rf vendor
          composer install --ignore-platform-reqs --no-interaction --no-progress

      - name: Compare with the committed vendor/
        run: |
          if [ -n "$(git status --porcelain -- vendor composer.lock)" ]; then
            git status --short -- vendor composer.lock | head -50
            echo "::error::vendor/ differs from what composer install produces. See README.md, Dependencies."
            exit 1
          fi
