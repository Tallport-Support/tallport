name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}, MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Production runs PHP 8.3 with the imap extension on MariaDB.
        php: ['8.3']
        mariadb: ['11.8']

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: freescout-test
          MARIADB_USER: freescout-test
          MARIADB_PASSWORD: freescout-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysql, mbstring, xml, imap, zip, gd, curl, intl, json
          coverage: none
          tools: composer

      - name: Cache test tools
        uses: actions/cache@v4
        with:
          path: dev/vendor
          key: dev-vendor-php${{ matrix.php }}-${{ hashFiles('dev/composer.lock') }}

      - name: Run tests
        env:
          DB_TEST_HOST: 127.0.0.1
        run: ./test.sh

  code-style:
    name: Code style (PHP_CodeSniffer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpcs:4

      # Rules and checked paths are in phpcs.xml.
      - name: Check code style
        run: phpcs
