# Tallport's website chat through your website's domain: inside your site's server block.
# Replace help.example.com with your Tallport address and SECRET with the proxy secret
# (Mailbox » Chat » Website Chat).
location /t/ {
    proxy_pass https://help.example.com/t/;
    proxy_ssl_server_name on;
    proxy_set_header Host help.example.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Tallport-Proxy "SECRET";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
}
