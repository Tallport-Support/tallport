# Tallport's website chat through your website's domain: inside your site's VirtualHost,
# with mod_proxy, mod_proxy_http, mod_ssl and mod_headers. Apache adds X-Forwarded-For itself.
# Replace help.example.com with your Tallport address and SECRET with the proxy secret.
SSLProxyEngine on
ProxyPass /t/ https://help.example.com/t/
ProxyPassReverse /t/ https://help.example.com/t/
<Location /t/>
    RequestHeader set X-Tallport-Proxy "SECRET"
    RequestHeader unset Cookie
</Location>
